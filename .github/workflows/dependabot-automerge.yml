name: Dependabot auto-merge

# Patch and minor dependency updates merge into `main` (and deploy) by themselves once every
# required check, including the browser tests, passes. Major versions are left open for a human look.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # A fine-grained token (AUTOMATION_TOKEN) makes the merge trigger CI and the deploy on main; merges
          # done with the default GITHUB_TOKEN don't start other workflows.
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
