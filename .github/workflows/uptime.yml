name: Uptime

# Checks production every 10 minutes. A failed run makes GitHub email you.
on:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Health endpoint answers
        run: |
          for attempt in 1 2 3; do
            curl -fsS --max-time 10 "https://${APP_DOMAIN}/api/health" && exit 0
            sleep 20
          done
          echo "::error::https://${APP_DOMAIN} is not healthy"
          exit 1
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'edu.vishnugandarapu.in' }}
      - name: Home page renders
        run: curl -fsS --max-time 10 "https://${APP_DOMAIN}/" | grep -q "Vishnu"
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'edu.vishnugandarapu.in' }}
