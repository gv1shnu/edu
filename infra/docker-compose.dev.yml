services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edu
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dev-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edu"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  # S3-compatible stand-in for Cloudflare R2 (any access key works locally). Creates the
  # bucket on start; files live in the `storage` volume.
  storage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        weed server -dir=/data -s3 -s3.port=9000 -master.volumeSizeLimitMB=64 -ip.bind=0.0.0.0 &
        until wget -q -O /dev/null http://localhost:9000/status; do sleep 1; done
        echo "s3.bucket.create -name ${R2_BUCKET:-edu}" | weed shell >/dev/null 2>&1 || true
        wait
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["storage:/data"]
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/status"]
      interval: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.22
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
volumes:
  dev-db:
  storage:
