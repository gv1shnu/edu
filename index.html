<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05030b">
  <title>Projects · Vishnu Gandarapu</title>
  <meta name="description" content="A live gallery of every public GitHub repository by Vishnu Gandarapu (gv1shnu).">
  <meta property="og:title" content="Projects · Vishnu Gandarapu">
  <meta property="og:description" content="A live gallery of every public GitHub repository by gv1shnu.">
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/city.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <canvas id="city" aria-hidden="true"></canvas>

  <nav class="topbar wrap">
    <a id="home" class="home" href="https://vishnugandarapu.in">&lt; vishnugandarapu.in</a>
    <span class="sys">NET_ARCHIVE // <span id="clock">--:--:--</span></span>
  </nav>

  <header class="hero wrap">
    <p class="kicker">// gv1shnu :: public repositories</p>
    <h1 id="title" class="glitch" data-text="PROJECTS">PROJECTS</h1>
    <p id="tagline" class="tagline">Every public repository, updated automatically.</p>
    <dl class="stats" id="stats" aria-live="polite"></dl>
  </header>

  <main class="wrap">
    <form class="controls" id="controls" onsubmit="return false">
      <input type="search" id="q" placeholder="Search name, description, topic…" aria-label="Search repositories" autocomplete="off">
      <select id="lang" aria-label="Filter by language"><option value="">All languages</option></select>
      <select id="topic" aria-label="Filter by topic"><option value="">All topics</option></select>
      <select id="sort" aria-label="Sort by">
        <option value="pushed">Recently updated</option>
        <option value="stars">Most stars</option>
        <option value="created">Newest</option>
        <option value="name">Name</option>
      </select>
      <div class="toggles">
        <label class="check"><input type="checkbox" id="showForks"> Forks</label>
        <label class="check"><input type="checkbox" id="showArchived"> Archived</label>
      </div>
    </form>

    <p class="status" id="status" aria-live="polite">Jacking in…</p>
    <ul class="grid" id="grid"></ul>
  </main>

  <footer class="wrap">
    <span id="freshness"></span>
    <span><a id="profile" href="https://github.com/gv1shnu">GitHub</a> · <a href="https://vishnugandarapu.in">Home</a></span>
    <span class="credit">Background art: <a href="https://opengameart.org/content/warped-city">Warped City</a> by Luis Zuno (@ansimuz), CC0</span>
  </footer>
</body>
</html>
